name: CI

# Runs on every push to any branch (so a change is proven before it can reach main, which Render deploys
# automatically) and on pull requests into main.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    # Two runner images with two different FFmpeg generations: ubuntu-24.04 installs FFmpeg 6.1, ubuntu-latest (now Ubuntu 26) FFmpeg 8.
    # The video tools are the part of this program that differs most from host to host, and the host that serves customers decides
    # which one it gets, so a change is proven on both before it can reach main.
    name: api (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: studio_local_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:localtest@localhost:5432/studio_local_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The end-to-end tests render real video with FFmpeg. They fail loudly in CI (instead of being skipped) when it is missing.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Says which FFmpeg this run has (the runner image changes now and then, and so does what it installs).
      - run: echo "::notice title=FFmpeg of this run::$(ffmpeg -version | head -1)"
      # Records how this FFmpeg lays out the listings the start-up check reads (the layout changed in FFmpeg 8), so that the real text can be
      # read later from the annotations of the run. It only observes: it never fails the run.
      - continue-on-error: true
        run: |
          text=$( {
            echo "-filters, first lines:"; ffmpeg -hide_banner -filters | head -8
            echo "-filters, ass and crop:"; ffmpeg -hide_banner -filters | grep -w -E 'ass|crop' | head -4
            echo "-encoders, libx264 and aac:"; ffmpeg -hide_banner -encoders | grep -w -E 'libx264|aac' | head -3
            echo "-h filter=ass:"; ffmpeg -hide_banner -h filter=ass | head -2
            echo "-h encoder=libx264:"; ffmpeg -hide_banner -h encoder=libx264 | head -2
          } 2>&1 ) || true
          text="${text//'%'/'%25'}"; text="${text//$'\r'/'%0D'}"; text="${text//$'\n'/'%0A'}"
          echo "::notice title=How this FFmpeg lists its filters and encoders::${text}"
      # Installs exactly the versions in package-lock.json (and fails if package.json and the lockfile disagree), so what
      # is tested here is what Render builds. Update the lockfile on purpose, never by accident.
      - run: npm ci
      # Type-checks both apps.
      - run: npm run check
      # API tests: real PostgreSQL, real FFmpeg, real HTTP uploads. Cloudflare R2 and speech recognition are replaced by test doubles.
      # The output is kept so that failing tests can be shown as annotations on the run (its full log is not always reachable).
      - run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - if: failure()
        run: node .github/scripts/show-failures.mjs test-output.txt
      # The compile step Render runs after building whisper.cpp; catches anything that only breaks in a production build.
      - run: npm run build --workspaces
